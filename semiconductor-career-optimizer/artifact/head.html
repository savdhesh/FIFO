<meta charset="utf-8">
<title>Semiconductor Career Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column under a quiet header; dense tables for the requirement matrix; status colour carries claim truthfulness. */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --fg:#13191c; --line:#d9dfe2; --accent:#0a5c8a;
  --g50:#f1f4f5; --g100:#e6ebed; --g400:#8a979d; --g500:#5c6a71; --g600:#46535a; --g700:#33404a;
  --red-bg:#fbe9e7; --red-line:#e8a39b; --red-solid:#b3261e; --red-fg:#8c1d18;
  --green-bg:#e3f3e8; --green-line:#8cc9a0; --green-fg:#1b5e36;
  --blue-bg:#e1eefa; --blue-fg:#164a7c;
  --amber-bg:#fdf1d8; --amber-line:#e3bd62; --amber-fg:#7a4b00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1417; --surface:#171e22; --fg:#e8eef1; --line:#2c373d; --accent:#5db3e6;
  --g50:#1c262b; --g100:#242f35; --g400:#76868e; --g500:#9aa9b0; --g600:#b3c0c6; --g700:#ccd6db;
  --red-bg:#3a1f1d; --red-line:#7d3b36; --red-solid:#d9534a; --red-fg:#f0aaa4;
  --green-bg:#17301f; --green-line:#2f6a45; --green-fg:#9fdcb4;
  --blue-bg:#16293b; --blue-fg:#9cc9f0;
  --amber-bg:#3a2d10; --amber-line:#8a6a1e; --amber-fg:#f0cf86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1417; --surface:#171e22; --fg:#e8eef1; --line:#2c373d; --accent:#5db3e6;
  --g50:#1c262b; --g100:#242f35; --g400:#76868e; --g500:#9aa9b0; --g600:#b3c0c6; --g700:#ccd6db;
  --red-bg:#3a1f1d; --red-line:#7d3b36; --red-solid:#d9534a; --red-fg:#f0aaa4;
  --green-bg:#17301f; --green-line:#2f6a45; --green-fg:#9fdcb4;
  --blue-bg:#16293b; --blue-fg:#9cc9f0;
  --amber-bg:#3a2d10; --amber-line:#8a6a1e; --amber-fg:#f0cf86; color-scheme:dark}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
table{border-collapse:collapse}
h1,h2,h3{text-wrap:balance;margin:0}
p,ul,dl,dd,dt{margin:0}ul{padding-left:1.25rem}
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input,select{font:inherit}
